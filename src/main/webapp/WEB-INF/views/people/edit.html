<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<form th:method="PATCH" th:action="@{/people/{id}/edit(id=${person.getId()})}" th:object="${person}">
    <label for="name">Введите ФИО: </label>
    <input type="text" th:field="*{name}" th:value="${person.getName()}" id="name">

    <div style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
    </div>

    <br>

    <label for="birthday">Введите дату рождения: </label>
    <input type="date" th:field="*{birthday}" id="birthday">

    <div style="color:red" th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}">
    </div>

    <br>
    <hr>

    <input type="submit" value="Редактировать">

</form>

</body>
</html>
