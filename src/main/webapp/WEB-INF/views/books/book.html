<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<p th:text="${book.getTitle() + ', ' + book.getAuthor() + ', ' + book.getYear()}"></p>

<div th:if="${patronName==null}">
    <p>Эта книга сейчас свободна. Кому назначить ее?</p>

    <form th:method="PATCH" th:action="@{/books/{id}/charge(id=${book.getId()})}">
        <label for="people">Выберите человека </label>

        <select id="people" name="personId">
            <option th:each="person: ${persons}" th:value="${person.getId()}" th:text="${person.getName()}"></option>
        </select>

        <input type="submit" value="Назначить кингу"/>
    </form>
</div>

<div th:if="${patronName!=null}">
    <p id="patron" th:text="${'Книга сейчас у: ' + patronName}"></p>

    <form th:method="PATCH" th:action="@{/books/{id}/discharge(id=${book.getId()})}">
        <input type="submit" value="Освободить книгу">
    </form>
</div>

<hr/>

<form th:method="GET" th:action="@{/books/{id}/edit(id=${book.getId()})}">
    <input type="submit" value="Редактировать">
</form>

<form th:method="DELETE" th:action="@{/books/{id}/edit(id=${book.getId()})}">
    <input type="submit" value="Удалить">
</form>

</body>
</html>
