<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div th:each="book : ${books}">
    <a th:text="${book.getTitle() + ', ' + book.getAuthor() + ', ' + book.getYear()}"
       th:href="@{/books/{id}(id=${book.getId()})}"></a>
    <br/>
</div>
<hr/>
<a th:href="@{/books/new}">Добавить книгу</a>

</body>
</html>
