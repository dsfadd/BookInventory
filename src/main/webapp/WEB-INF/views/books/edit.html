<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form th:method="PATCH" th:action="@{/books/{id}(id=${book.getId()})}" th:object="${book}">
    <label for="title">Введите название книги: </label>
    <input type="text" id="title" name="title" th:value="${book.getTitle()}" th:field="*{title}">

    <div style="color:red" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
    </div>

    <br/>

    <label for="author">Введите автора: </label>
    <input type="text" id="author" name="author" th:value="${book.getAuthor()}" th:field="*{author}">

    <div style="color:red" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">
    </div>

    <br/>

    <label for="year">Введите год: </label>
    <input type="number" id="year" min="1" max="2026" name="year" th:value="${book.getYear()}" th:field="*{year}">

    <div style="color:red" th:if="${#fields.hasErrors('year')}" th:errors="*{year}">
    </div>

    <br/>

    <input type="submit" value="Редактировать">
</form>
</body>
</html>
